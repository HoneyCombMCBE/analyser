name: Binary Analyzer

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag containing the binary asset'
        required: true
        type: string
      asset_name:
        description: 'Binary asset filename (e.g. Minecraft.Windows.exe)'
        required: true
        type: string
      binary_is_bds:
        description: 'Is this a BDS binary (with PDB symbols)?'
        required: false
        default: false
        type: boolean

env:
  GHIDRA_VERSION: 12.1.2
  GHIDRA_ZIP: ghidra_12.1.2_PUBLIC_20260605.zip
  GHIDRA_URL: https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.1.2_build/ghidra_12.1.2_PUBLIC_20260605.zip
  GHIDRA_DIR: ghidra_12.1.2_PUBLIC
  BINEXPORT_COMMIT: main

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Ghidra
        id: cache-ghidra
        uses: actions/cache@v4
        with:
          path: ${{ env.GHIDRA_DIR }}
          key: ghidra-${{ env.GHIDRA_VERSION }}

      - name: Download and extract Ghidra
        if: steps.cache-ghidra.outputs.cache-hit != 'true'
        run: |
          wget -q "$GHIDRA_URL" -O "$GHIDRA_ZIP"
          unzip -q "$GHIDRA_ZIP"
          rm "$GHIDRA_ZIP"

      - name: Cache BinExport extension
        id: cache-binexport
        uses: actions/cache@v4
        with:
          path: binexport-extension
          key: binexport-${{ env.GHIDRA_VERSION }}-${{ env.BINEXPORT_COMMIT }}

      - name: Build BinExport extension
        if: steps.cache-binexport.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/google/binexport.git binexport-src
          cd binexport-src/java

          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O gradle.zip
          unzip -q gradle.zip
          export PATH="$PWD/gradle-8.7/bin:$PATH"

          gradle -PGHIDRA_INSTALL_DIR="$GITHUB_WORKSPACE/$GHIDRA_DIR"

          mkdir -p "$GITHUB_WORKSPACE/binexport-extension"
          cp dist/*.zip "$GITHUB_WORKSPACE/binexport-extension/"

      - name: Install BinExport extension
        run: |
          EXT_DIR="$GHIDRA_DIR/Ghidra/Extensions"
          mkdir -p "$EXT_DIR"
          unzip -q -o binexport-extension/*.zip -d "$EXT_DIR"

      - name: Download binary from release
        run: |
          gh release download "${{ inputs.release_tag }}" \
            --pattern "${{ inputs.asset_name }}" \
            --dir binary

      - name: Download PDB (if BDS binary)
        id: pdb-download
        if: inputs.binary_is_bds
        run: |
          gh release download "${{ inputs.release_tag }}" \
            --pattern "*.pdb" \
            --dir binary
          PDB_FILE=$(ls binary/*.pdb 2>/dev/null | head -1)
          if [ -n "$PDB_FILE" ]; then
            echo "pdb_path=$PDB_FILE" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Ghidra headless analysis + export
        env:
          JAVA_TOOL_OPTIONS: -Xmx6g
        run: |
          OUT_DIR="$GITHUB_WORKSPACE/output"
          mkdir -p "$OUT_DIR/project"

          PRESCRIPT_ARGS=""
          if [ -n "${{ steps.pdb-download.outputs.pdb_path }}" ]; then
            PRESCRIPT_ARGS="-preScript SetPdbPath.java ${{ steps.pdb-download.outputs.pdb_path }}"
          fi

          "$GHIDRA_DIR/support/analyzeHeadless" \
            "$OUT_DIR/project" \
            "MinecraftAnalysis" \
            -import "$GITHUB_WORKSPACE/binary/${{ inputs.asset_name }}" \
            -scriptPath "$GITHUB_WORKSPACE/ghidra_scripts" \
            $PRESCRIPT_ARGS \
            -postScript ExportFunctions.java "$OUT_DIR/functions.json" \
            -postScript ExportGzf.java "$OUT_DIR/ghidra_project.gzf" \
            -postScript BinExport.java "$OUT_DIR/output.BinExport" \
            -overwrite

      - name: Upload artifacts to release
        run: |
          gh release upload "${{ inputs.release_tag }}" \
            output/functions.json \
            output/ghidra_project.gzf \
            output/output.BinExport \
            --clobber
